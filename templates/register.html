{% extends "base.html" %}
{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-lg-7">
<div class="card shadow-sm"><div class="card-body p-4">
<h3>Student Registration</h3>
<form method="post">
<div class="row">
<div class="col-md-6 mb-3"><label class="form-label">Full Name *</label><input class="form-control" name="name" required></div>
<div class="col-md-6 mb-3"><label class="form-label">Email *</label><input class="form-control" type="email" name="email" required></div>
<div class="col-md-6 mb-3"><label class="form-label">Phone</label><input class="form-control" name="phone"></div>
<div class="col-md-3 mb-3"><label class="form-label">Hostel Block *</label><input class="form-control" name="hostel_block" required></div>
<div class="col-md-3 mb-3"><label class="form-label">Room No. *</label><input class="form-control" name="room_number" required></div>
<div class="col-md-6 mb-3"><label class="form-label">Password *</label><input class="form-control" type="password" name="password" minlength="6" required></div>
</div>
<button class="btn btn-primary">Submit Registration</button>
</form>
</div></div>
</div>
</div>
{% endblock %}
