{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h2 class="mb-2">Reset Password</h2>
      <p class="text-muted">Choose a new password. It must contain at least 8 characters.</p>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">New Password</label>
          <input class="form-control" type="password" name="password" minlength="8" required autocomplete="new-password">
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm New Password</label>
          <input class="form-control" type="password" name="confirm_password" minlength="8" required autocomplete="new-password">
        </div>
        <button class="btn btn-success w-100" type="submit">Reset Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
